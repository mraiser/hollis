[package]
name = "hollis"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

# Self-contained: not a member of the host checkout's cargo workspace
[workspace]

[dependencies]
num-complex = "0.4"
attohttpc = { version = "0.26.1", features = ["json"] }
rustfft = "6.1"
crossbeam-channel = "0.5"
chrono = "0.4"
crossterm = "0.29.0"
transcribe-rs = { version = "0.3", features = ["onnx"] }
ort = "=2.0.0-rc.12"
ureq = { version = "2", features = ["json"] }
cpal = "0.16.0"
flowlang = { version="=0.3.34" }
ndata = { version="=0.3.17" }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
python_runtime = ["flowlang/python_runtime"]
serde_support = ["serde", "serde_json", "flowlang/serde_support", "ndata/serde_support"]
reload = []
default = []
